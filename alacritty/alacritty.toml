#general.import = ["~/.cache/wal/colors-alacritty.toml"]

[env]
WINIT_X11_SCALE_FACTOR = "1.3"

[font]
size = 13

[font.normal]
family = "Terminess Nerd Font"
style = "Bold"

[font.bold]
family = "Terminess Nerd Font"
style = "Bold"

[font.italic]
family = "Terminess Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Terminess Nerd Font"
style = "Bold Italic"

[window.padding]
x = 5
y = 7

[font.offset]
x = 0
y = -4

[colors.primary]
background = "#070909"
foreground = "#f5f5f5"

[colors.cursor]
text = "#070909"
cursor = "#f5f5f5"

[colors.normal]
black = "#070909"
red = "#748A92"
green = "#999EA0"
yellow = "#B4C3C8"
blue = "#D1D5D8"
magenta = "#F7F8F7"
cyan = "#FBFBFB"
white = "#f5f5f5"

[colors.bright]
black = "#ababab"
red = "#748A92"
green = "#999EA0"
yellow = "#B4C3C8"
blue = "#D1D5D8"
magenta = "#F7F8F7"
cyan = "#FBFBFB"
white = "#f5f5f5"
