[env]
WINIT_X11_SCALE_FACTOR = "1.3"

[font]
size = 12.5

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[window.padding]
x = 5
y = 7

[font.offset]
x = 0
y = -4

# Default colors
[colors.primary]
background = '#000000'
foreground = '#f1f1f1'

[colors.cursor]
cursor = '#f1f1f1'
text = '#000000'

# Normal colors
[colors.normal]
black = '#231c14'
red = '#5f8787'
green = '#c1c1c1'
yellow = '#888888'
blue = '#aaaaaa'
magenta = '#999999'
cyan = '#ddeecc'
white = '#f1f1f1'

# Bright colors
[colors.bright]
black = '#505050'
red = '#5f8787'
green = '#c1c1c1'
yellow = '#888888'
blue = '#aaaaaa'
magenta = '#99bbaa'
cyan = '#ddeecc'
white = '#f1f1f1'
