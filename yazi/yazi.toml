[mgr]
show_hidden = true

[opener]
edit = [
    { run = 'nvim "%s"', block = true, desc = "Edit", for = "unix" }
]
vlc = [
    { run = 'vlc "%*"', orphan = true, desc = "Open in VLC", for = "linux" }
]

[open]
prepend_rules = [
    { mime = "text/*", use = "edit" },
    { mime = "video/*", use = [ "vlc", "reveal" ] },
    { mime = "audio/*", use = [ "vlc", "reveal" ] }
]
